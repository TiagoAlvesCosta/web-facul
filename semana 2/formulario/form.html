<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style2.css">
    <title>Document</title>
</head>
<body>
    <div class="formulario">
        <h2>Formatação de Formulario</h2>
        <form action="form_action.html">
            <div class="campo">
                <span class="tag"><label for="nome">Nome</label></span>
                <input type="text" id="nome" name="nome" placeholder="Seu nome...">
            </div>
            <div class="campo">
                <span class="tag"><label for="s_nome">Sobrenome</label></span>
                <input type="text" id="s_nome" name="s_nome" placeholder="Seu sobrenome..."> 
            </div>
            <div class="campo">
                <span class="tag"><label for="pais">Pais</label></span>
                <select name="pais" id="pais" required>
                    <option value="" disabled selected>Seu pais..</option>
                    <option value="brasil">Brasil</option>
                    <option value="eua">EUA</option>
                    <option value="argentina">Argentina</option>
                    <option value="outro">Outro</option>
                </select>
            </div>
            <div class="campo">
                <span class="tag"><label for="email">E-mail</label></span>
                <input type="email" name="email" id="email" placeholder="nome@email.com" required>
            </div>
            <div class="campo">
                <span class="tag"><label for="pwd">Senha:</label></span>
                <input type="password" name="senha" id="pwd" placeholder="Seu senha..." required>
            </div>
            <div class="campo">
                <input type="submit" value="Enviar">
            </div>
        </form>
    </div>
</body>
</html>
