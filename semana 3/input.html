<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Demonstraçao de JS</h2>
    <p id="nom">Para conhecer voce, clique no botao abaixo</p>
    <p id="num"></p>
    <p id="tp_nom"></p>
    <p id="tp_num"></p>
    <button type="button" onclick="myFunction()">Ao acionar este botao, vou conhecer voce</button>

    <script>
        // Declara funçao sem parametro de entrada
        function myFunction() {
            // Declara variaveis "nome" e "num"
            // Em seguida atribui os valores digitados pelo usuario, no prompt
            let nom = prompt("Qual o seu nome? ");
            let num = prompt("Qual o seu numero favorito? ");

            // Usa as respostas do usuario para apresentar a informaçao no HTML
            document.getElementById("nom").innerHTML = "ola " + nom + "! É muito bom conhecer voce!"
            document.getElementById("num").innerHTML = num + " tambem é meu numero preferido"

            // Exibe os tipos de dados das variaveis "nom" e "num" dos elementos HTML com id="tp_nom" e id="tp_num"
            document.getElementById("tp_nom").innerHTML = "A varivael \"nom\" é uma " + typeof nom;
            document.getElementById("tp_num").innerHTML = "A variavel \"num\" é uma " + typeof num;
        }
    </script>
</body>
</html>
