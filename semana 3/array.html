<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>JavaScript Arrays</h2>
    <p id="texto1"></p>
    <p id="texto2"></p>
    <p id="texto3"></p>
    <script>
        var frutas = ['Abacate', 'Uva', 'Limao'];
        var minhaFruta = frutas[1];  // Uva
        var fTam = frutas.length;  // Informa o total de elementos no array
        document.getElementById("texto1").innerHTML = 'Minha frutas = ' + minhaFruta
        document.getElementById("texto2").innerHTML = 'Total de frutas = ' + fTam

        var text = "<ul>";
            for (let i = 0; i < fTam; i++) {  // For que percorre o array e monta o HTML de lista
                text += "<li>" + frutas[i] + "</li>";
            }
            text += "</ul>";  // finaliza o HTML de lista
            document.getElementById('texto3').innerHTML = text;  // mostra lista de frutas
    </script>
</body>
</html>
