<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html {
            font-family: 'Lucida Sans';
        }

        body {
            width: 70%;
            max-width: 900px;
            min-width: 500px;
            margin: 0 40px;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <h2>Comandos JS</h2>
    <h4>Laços de repetição</h4>
    <div class="textos">  <!-- agrupa os 3 elementos p -->
        <p class="texto1"></p>
        <p class="texto2"></p>
        <p class="texto3"></p>
    </div>
    <script>
        var textos = document.querySelectorAll('.textos p');  // agrupas os elementos da classe textos
        for (let i = 0; i < textos.length; i++) {
            textos[i].textContent = i + 1;
        }
    </script>
</body>
</html>
